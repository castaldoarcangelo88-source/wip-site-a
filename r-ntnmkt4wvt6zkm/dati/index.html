const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function apri(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.v)},k,u(D.c)));
try{sessionStorage.setItem("pp",pw)}catch(_){}document.open();document.write(t);document.close();}
const W=()=>{try{return +localStorage.getItem("pt")||0}catch(_){return 0}},SW=n=>{try{localStorage.setItem("pt",n)}catch(_){}};

try{await apri(document.getElementById("pw").value);SW(0)}catch(_){const n=W()+1;SW(n);let s=Math.min(2**(n-1),30);const t=()=>{r.textContent="Password errata. Riprova tra "+s+" s";if(s--<=0){r.textContent="Password errata.";bt.disabled=false}else setTimeout(t,1000)};t()}});
try{const p=sessionStorage.getItem("pp");if(p)apri(p).catch(()=>sessionStorage.removeItem("pp"))}catch(_){}
