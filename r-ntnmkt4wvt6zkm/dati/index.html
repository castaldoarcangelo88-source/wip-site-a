const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function apri(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);

try{sessionStorage.setItem("pp",pw)}catch(_){}document.open();document.write(t);document.close();}
